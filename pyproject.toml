[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cwmodel"
version = "0.1.0"
description = "Latent transition world-model fine-tuning toolkit"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.1.0",
  "huggingface_hub>=0.25.0",
  "numpy>=1.24",
  "peft>=0.13.0",
  "PyYAML>=6.0.0",
  "safetensors>=0.4.0",
  "tensorboard>=2.14",
  "tokenizers>=0.20.0",
  "torch>=2.3.0",
  "transformers>=4.45.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
